<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jira Ticket Cluster Alert</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <h1>Jira Ticket Cluster Alert</h1>
        <p>Watches IT-* Jira tickets and alerts when similar summaries cluster together.</p>
      </header>

      <section class="card">
        <h2>Status</h2>
        <dl id="status-grid" class="status-grid"></dl>
        <p id="last-error" class="error-text"></p>
      </section>

      <section class="card">
        <h2>Current Ticket Clusters</h2>
        <div id="clusters"></div>
      </section>

      <section class="card">
        <h2>Recent Alerts</h2>
        <div id="alerts"></div>
      </section>
    </main>

    <script src="../../dist/src/renderer/ui.js"></script>
  </body>
</html>
